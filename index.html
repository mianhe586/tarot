<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塔羅抽牌</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; font-family: "Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  background: #faf8f4; color: #241f1a; line-height: 1.75; }
.wrap { max-width: 980px; margin: 0 auto; }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: .04em; }
.sub { color: #7d7268; font-size: 13px; margin-bottom: 20px; }
.step { display: none; } .step.on { display: block; }
.stepbar { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
.stepbar span { font-size: 12px; padding: 4px 12px; border-radius: 999px; background: #ece5da; color: #8b8075; }
.stepbar span.cur { background: #2e3f5c; color: #fff; }
.stepbar span.done { background: #c6b79f; color: #fff; }
h2 { font-size: 17px; margin: 0 0 14px; color: #2e3f5c; }
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 14px; }
.pick { border: 1px solid #ddd3c4; background: #fff; border-radius: 10px; padding: 18px;
  cursor: pointer; text-align: left; font: inherit; color: inherit; transition: .15s;
  display: flex; flex-direction: column; }
.pick:hover { border-color: #2e3f5c; box-shadow: 0 3px 14px rgba(46,63,92,.12); transform: translateY(-2px); }
.pick b { display: block; font-size: 16px; margin-bottom: 6px; color: #2e3f5c; }
.pick p { margin: 0; font-size: 13px; color: #6d6459; line-height: 1.65; }
.pick .cnt { display: inline-block; margin-top: auto; padding-top: 6px; font-size: 12px; color: #a1937f; }
.minibox { height: 253.9px; margin: 14px 0 6px; display: flex; align-items: center; justify-content: center; }
.mini { position: relative; flex: none; }
.mini i { position: absolute; background: #cfc2ab; border-radius: 2px; font-style: normal;
  font-size: 9px; color: #fff; display: flex; align-items: center; justify-content: center; }
textarea { width: 100%; min-height: 96px; padding: 14px; font: inherit; font-size: 15px;
  border: 1px solid #ddd3c4; border-radius: 10px; background: #fff; resize: vertical; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 22px; }
.chip { padding: 7px 18px; border-radius: 999px; border: 1px solid #ddd3c4; background: #fff;
  cursor: pointer; font: inherit; font-size: 14px; color: #6d6459; }
.chip.on { background: #2e3f5c; border-color: #2e3f5c; color: #fff; }
button.go { padding: 11px 30px; border-radius: 999px; border: none; background: #2e3f5c;
  color: #fff; font: inherit; font-size: 15px; cursor: pointer; }
button.ghost { padding: 9px 22px; border-radius: 999px; border: 1px solid #ddd3c4; background: #fff;
  color: #6d6459; font: inherit; font-size: 14px; cursor: pointer; }
.shufrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 6px 0 2px; }
button.shuf { padding: 11px 28px; border-radius: 999px; border: 1px solid #2e3f5c; background: #fff;
  color: #2e3f5c; font: inherit; font-size: 15px; cursor: pointer; user-select: none;
  -webkit-user-select: none; touch-action: none; }
button.shuf.on { background: #2e3f5c; color: #fff; }
.shufhint { font-size: 13px; color: #8b8075; }
.prog { font-size: 14px; color: #6d6459; margin: 8px 0 0; } .prog b { color: #2e3f5c; font-size: 16px; }
.slotnow { background: #fff; border: 1px solid #ddd3c4; border-left: 4px solid #2e3f5c;
  border-radius: 8px; padding: 12px 16px; margin-top: 14px; font-size: 14px; }
.slotnow b { color: #2e3f5c; }
.taken { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 2px; }
.tk { font-size: 12px; padding: 5px 12px; border-radius: 999px; background: #fff;
  border: 1px solid #ddd3c4; color: #4a4137; }
.tk b { color: #2e3f5c; } .tk .u { color: #4a6b47; } .tk .r { color: #9a5449; }
.deck { display: grid; position: relative; overflow: visible; grid-template-columns: repeat(auto-fill, minmax(38px,1fr)); gap: 7px; margin-top: 16px; }
.back { aspect-ratio: 5/8; position: relative; border-radius: 4px; cursor: pointer; border: none; padding: 0;
  background: repeating-linear-gradient(45deg,#2e3f5c,#2e3f5c 3px,#3a4d6e 3px,#3a4d6e 6px);
  transition: transform .13s ease, box-shadow .13s ease, background .2s; }
.back:hover { transform: translateY(-4px); box-shadow: 0 4px 12px rgba(46,63,92,.3); }
.back.used { background: #e3ddd2; cursor: default; transform: none !important; box-shadow: none; }
.deck.shuffling .back { transition: none; }
.deck.shuffling .back:hover { box-shadow: none; }
.ovl { position: fixed; inset: 0; background: rgba(36,31,26,.55); display: none;
  align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.ovl.on { display: flex; }
.revealbox { text-align: center; max-width: 340px; width: 100%; }
.rslot { color: #f3ece1; font-size: 14px; margin-bottom: 14px; } .rslot b { color: #fff; font-size: 16px; }
.perspec { perspective: 1000px; width: 190px; margin: 0 auto 18px; }
.flip { position: relative; width: 100%; aspect-ratio: 5/8; transform-style: preserve-3d;
  transform: rotateY(180deg); transition: transform .75s cubic-bezier(.3,.9,.35,1); }
.flip.on { transform: rotateY(0deg); }
.fface { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 14px; text-align: center; }
.fback { transform: rotateY(180deg); border: 3px solid #f3ece1;
  background: repeating-linear-gradient(45deg,#2e3f5c,#2e3f5c 5px,#3a4d6e 5px,#3a4d6e 10px); }
.ffront { background: #fdfbf7; border: 1px solid #cbbfa9; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.ffront .inner { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ffront.rev .inner { transform: rotate(180deg); }
.ffront .grp { font-size: 11px; color: #a1937f; letter-spacing: .1em; }
.ffront .zh { font-size: 21px; font-weight: 700; color: #2e3f5c; line-height: 1.25; }
.ffront .en { font-size: 12px; color: #8b8075; }
.rname { color: #f3ece1; font-size: 14px; min-height: 22px; margin-bottom: 16px; }
.rname .badge { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 12px; }
.rname .badge.up { background: #dff0da; color: #3d6139; }
.rname .badge.rev { background: #f6dcd7; color: #8d4a3f; }
.q { background: #f1ece2; border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; font-size: 14px; }
.q b { color: #2e3f5c; }
.board { position: relative; width: 100%; margin: 10px auto 26px; }
.slot { position: absolute; }
.slotcard { width: 100%; height: 100%; border-radius: 6px; background: #fff; border: 1px solid #cbbfa9;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px;
  text-align: center; font-size: 11px; line-height: 1.3; overflow: hidden; position: relative; }
.slotcard .no { position: absolute; top: 3px; left: 5px; font-size: 10px; color: #b3a894; }
.slotcard .nm { font-weight: 700; color: #2e3f5c; font-size: 12px; }
.slotcard.rev .nm { transform: rotate(180deg); }
.slotcard .or { font-size: 10px; margin-top: 3px; padding: 1px 7px; border-radius: 999px; }
.or.up { background: #e4ede1; color: #4a6b47; }
.or.rev { background: #f3e3e0; color: #9a5449; }
.rows { border-top: 1px solid #e6ded2; padding-top: 18px; }
.row { display: flex; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #f0eae0; }
.row .idx { flex: none; width: 26px; color: #a1937f; font-size: 13px; }
.row .lab { flex: none; width: 116px; color: #6d6459; font-size: 13.5px; }
.row .cd { flex: 1; font-size: 15px; color: #241f1a; }
.row .cd em { font-style: normal; font-size: 12px; color: #8b8075; margin-left: 6px; }
.row .or { flex: none; }
.copybox { background: #fff; border: 1px solid #ddd3c4; border-radius: 12px; padding: 18px 20px; margin: 24px 0; }
.copybox p { margin: 0 0 12px; font-size: 13.5px; color: #6d6459; }
.copybox textarea { min-height: 150px; font-size: 13px; line-height: 1.6; background: #faf8f4; }
.cpbtns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.ok { font-size: 13px; color: #4a6b47; }
.foot { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
.hislist { display: flex; flex-direction: column; gap: 10px; }
.hisrow { display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: #fff; border: 1px solid #ddd3c4; border-radius: 10px; padding: 14px 16px; }
.hisrow .info { flex: 1; min-width: 0; cursor: pointer; }
.hisrow .when { font-size: 12px; color: #a1937f; letter-spacing: .03em; }
.hisrow .qq { font-size: 15px; margin: 3px 0 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hisrow .meta { font-size: 12px; color: #8b8075; }
.hisrow .meta em { font-style: normal; color: #2e3f5c; }
.hisrow .del { border: none; background: none; color: #b9a894; font: inherit; font-size: 13px;
  cursor: pointer; padding: 6px 8px; border-radius: 6px; flex: none; }
.hisrow .del:hover { background: #f6ece9; color: #9a5449; }
.empty { color: #8b8075; font-size: 14px; padding: 30px 0; text-align: center; }
.detail { display: none; } .detail.on { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>塔羅抽牌</h1>
      <div class="sub">這個工具只負責洗牌、抽牌與保存結果，不提供牌義解讀。</div>
    </div>
    <button class="ghost" id="hisBtn">抽牌紀錄</button>
  </div>

  <div class="stepbar" id="stepbar">
    <span id="b1">1 選牌陣</span><span id="b2">2 提問</span><span id="b3">3 抽牌</span><span id="b4">4 結果</span>
  </div>

  <div class="step on" id="s1">
    <h2>選擇一個牌陣</h2>
    <div class="cards3" id="spreadList"></div>
  </div>

  <div class="step" id="s2">
    <h2>你想問什麼？</h2>
    <textarea id="qtext" placeholder="例如：我和現在這位對象有沒有長期發展的可能？&#10;例如：該不該接下這個新的工作機會？"></textarea>
    <div style="font-size:13px;color:#8b8075;margin-top:10px">這個提問偏向哪個面向？</div>
    <div class="chips" id="aspects"></div>
    <button class="go" id="toDraw">開始抽牌</button>
    <button class="ghost" onclick="goto(1)">上一步</button>
  </div>

  <div class="step" id="s3">
    <h2>洗牌與抽牌</h2>
    <div class="shufrow">
      <button class="shuf" id="shufBtn">按住洗牌</button>
      <span class="shufhint" id="shufHint">按住不放，牌會一直洗；放開就停下來。心裡想著你的提問。</span>
    </div>
    <div class="prog">已抽 <b id="cnt">0</b> / <span id="need">0</span> 張</div>
    <div class="slotnow" id="slotNow"></div>
    <div class="taken" id="taken"></div>
    <div class="deck" id="deck"></div>
    <div class="foot"><button class="ghost" id="reshuffle">全部重來</button></div>
  </div>

  <div class="step" id="s4">
    <div class="q" id="qEcho"></div>
    <div class="board" id="board"></div>
    <div class="rows" id="rows"></div>
    <div class="copybox">
      <p>把下面這段文字傳給幫你解牌的人就可以了。</p>
      <textarea id="exportText" readonly></textarea>
      <div class="cpbtns">
        <button class="go" id="copyBtn">複製結果</button>
        <button class="ghost" id="dlBtn">下載成文字檔</button>
        <span class="ok" id="copyOk"></span>
      </div>
    </div>
    <div class="foot">
      <button class="go" id="again">再抽一次</button>
      <button class="ghost" id="toHis">看抽牌紀錄</button>
    </div>
  </div>

  <div class="step" id="s5">
    <div class="topbar" style="margin-bottom:16px">
      <h2 style="margin:0" id="hisTitle">抽牌紀錄</h2>
      <div style="display:flex;gap:8px">
        <button class="ghost" id="hisBack">回到抽牌</button>
        <button class="ghost" id="hisClear">清空全部</button>
      </div>
    </div>
    <div id="hisList" class="hislist"></div>
    <div id="hisDetail" class="detail">
      <button class="ghost" id="detBack" style="margin-bottom:16px">← 回到列表</button>
      <div class="q" id="dEcho"></div>
      <div class="board" id="dBoard"></div>
      <div class="rows" id="dRows"></div>
      <div class="copybox">
        <p>這一次的結果：</p>
        <textarea id="dExport" readonly></textarea>
        <div class="cpbtns">
          <button class="go" id="dCopy">複製結果</button>
          <span class="ok" id="dCopyOk"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="ovl" id="ovl">
  <div class="revealbox">
    <div class="rslot" id="rslot"></div>
    <div class="perspec">
      <div class="flip" id="flip">
        <div class="fface ffront" id="ffront"></div>
        <div class="fface fback"></div>
      </div>
    </div>
    <div class="rname" id="rname"></div>
    <button class="go" id="nextBtn">繼續</button>
  </div>
</div>

function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function goto(n) {
  for (let i = 1; i <= 5; i++) document.getElementById("s" + i).classList.toggle("on", i === n);
  document.getElementById("stepbar").style.display = n === 5 ? "none" : "flex";
  document.getElementById("hisBtn").style.display = n === 5 ? "none" : "block";
  for (let i = 1; i <= 4; i++) {
    const b = document.getElementById("b" + i);
    b.className = i === n ? "cur" : (i < n ? "done" : "");
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const deckEl = document.getElementById("deck");
function startDraw() {
  state.order = shuffle([...Array(78).keys()]);
  state.picks = [];
  document.getElementById("need").textContent = state.spread.slots.length;
  document.getElementById("cnt").textContent = "0";
  document.getElementById("taken").innerHTML = "";
  document.getElementById("shufHint").textContent = "按住不放，牌會一直洗；放開就停下來。心裡想著你的提問。";
  ovl.classList.remove("on");
  deckEl.innerHTML = "";
  for (let i = 0; i < 78; i++) {
    const b = document.createElement("button");
    b.className = "back";
    b.onclick = () => pick(i, b);
    deckEl.appendChild(b);
  }
  updateSlotNow();
  goto(3);
}
function updateSlotNow() {
  const sl = state.spread.slots[state.picks.length];
  const box = document.getElementById("slotNow");
  if (!sl) { box.textContent = "抽牌完成，正在整理牌陣……"; return; }
  box.innerHTML = "現在抽的是第 <b>" + sl.n + "</b> 張";
}
let rafId = null;
let pos = [];
let t0 = 0;
let lastReorder = 0;

// 量出每張牌相對於整片牌堆中心的位置，換算成橢圓極座標
function measureDeck() {
  const hw = (deckEl.clientWidth || 600) / 2;
  const hh = (deckEl.clientHeight || 300) / 2;
  const backs = deckEl.children;
  pos = [];
  for (let i = 0; i < backs.length; i++) {
    const b = backs[i];
    const hx = b.offsetLeft + b.offsetWidth / 2 - hw;
    const hy = b.offsetTop + b.offsetHeight / 2 - hh;
    const nx = hx / (hw || 1);
    const ny = hy / (hh || 1);
    pos.push({
      hx: hx, hy: hy, hw: hw, hh: hh,
      a0: Math.atan2(ny, nx),                       // 起始角度
      rn: Math.min(1.1, Math.hypot(nx, ny)),        // 所在的圈（0＝中心，1＝外圍）
      // 每張牌各自獨立的擾動：頻率與相位都不同，才不會整片同步
      f1: 0.5 + Math.random() * 0.6, p1: Math.random() * 6.283,
      f2: 1.3 + Math.random() * 1.1, p2: Math.random() * 6.283,
      f3: 0.7 + Math.random() * 0.9, p3: Math.random() * 6.283,
      f4: 1.8 + Math.random() * 1.6, p4: Math.random() * 6.283,
      lead: (Math.random() - 0.5) * 0.7,            // 同一圈內的超前／落後
      pull: 0.72 + Math.random() * 0.34,            // 各自往中心聚攏的程度
    });
  }
}

function frame(ts) {
  if (!t0) t0 = ts;
  const t = (ts - t0) / 1000;

  if (t - lastReorder > 0.2) { shuffle(state.order); lastReorder = t; }

  const backs = deckEl.children;
  for (let i = 0; i < backs.length; i++) {
    const b = backs[i];
    const q = pos[i];
    if (!q || b.classList.contains("used")) continue;

    // 內圈轉得比外圈快，整片就會被扭成螺旋
    const w = 1.55 - 0.72 * q.rn;
    // 角度上再加一段自己的漂移，同一圈的牌會彼此穿越
    const a = q.a0 - w * t + 0.4 * Math.sin(q.f3 * t + q.p3) + q.lead;
    // 半徑大幅起伏並整體往中心壓，牌就會擠成一堆互相疊
    const rn = q.rn * q.pull
      * (1 + 0.2 * Math.sin(q.f1 * t + q.p1) + 0.12 * Math.sin(q.f2 * t + q.p2))
      + 0.05;

    const x = Math.cos(a) * rn * q.hw - q.hx + Math.sin(q.f4 * t + q.p4) * 10;
    const y = Math.sin(a) * rn * q.hh - q.hy + Math.cos(q.f4 * t + q.p1) * 8;
    const rot = -(38 + q.rn * 34) * t + 14 * Math.sin(q.f2 * t + q.p2);

    b.style.zIndex = String(200 + Math.round(Math.sin(a) * 70 +
      Math.sin(q.f2 * t + q.p2) * 45));
    b.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) +
      "px) rotate(" + rot.toFixed(1) + "deg)";
  }
  rafId = requestAnimationFrame(frame);
}

function startShuffle(e) {
  if (e) e.preventDefault();
  if (rafId) return;
  document.getElementById("shufBtn").classList.add("on");
  document.getElementById("shufHint").textContent = "洗牌中……放開就停。";
  deckEl.classList.add("shuffling");
  measureDeck();
  t0 = 0;
  lastReorder = 0;
  rafId = requestAnimationFrame(frame);
}

function stopShuffle() {
  if (!rafId) return;
  cancelAnimationFrame(rafId);
  rafId = null;
  document.getElementById("shufBtn").classList.remove("on");
  document.getElementById("shufHint").textContent = "洗好了，接著點下方任何一張牌背。";
  deckEl.classList.remove("shuffling");
  pos = [];
  for (const b of deckEl.children) { b.style.transform = ""; b.style.zIndex = ""; }
}

const shufBtn = document.getElementById("shufBtn");
shufBtn.addEventListener("pointerdown", startShuffle);
["pointerup", "pointercancel", "pointerleave"].forEach((ev) => shufBtn.addEventListener(ev, stopShuffle));
window.addEventListener("blur", stopShuffle);

const ovl = document.getElementById("ovl");
const flip = document.getElementById("flip");
const nextBtn = document.getElementById("nextBtn");

function pick(i, el) {
  if (rafId) return;
  if (el.classList.contains("used")) return;
  if (state.picks.length >= state.spread.slots.length) return;
  const slot = state.spread.slots[state.picks.length];
  const p = { card: DECK[state.order[i]], rev: Math.random() < 0.5 };
  el.classList.add("used"); el.onclick = null;
  state.picks.push(p);
  document.getElementById("cnt").textContent = state.picks.length;
  const chip = document.createElement("span");
  chip.className = "tk";
  chip.innerHTML = "<b>" + slot.n + "</b>　" + p.card.zh +
    ' <span class="' + (p.rev ? "r" : "u") + '">' + (p.rev ? "逆" : "正") + "</span>";
  document.getElementById("taken").appendChild(chip);
  reveal(slot, p);
}
function reveal(slot, p) {
  const last = state.picks.length === state.spread.slots.length;
  document.getElementById("rslot").innerHTML = "第 <b>" + slot.n + "</b> 張";
  document.getElementById("ffront").className = "fface ffront" + (p.rev ? " rev" : "");
  document.getElementById("ffront").innerHTML =
    '<div class="inner"><span class="grp">' + p.card.group + '</span><span class="zh">' + p.card.zh +
    '</span><span class="en">' + p.card.en + "</span></div>";
  document.getElementById("rname").innerHTML =
    '<span class="badge ' + (p.rev ? "rev" : "up") + '">' + (p.rev ? "逆位" : "正位") + "</span>";
  nextBtn.textContent = last ? "看結果" : "繼續抽下一張";
  flip.classList.remove("on");
  ovl.classList.add("on");
  requestAnimationFrame(() => requestAnimationFrame(() => flip.classList.add("on")));
  nextBtn.onclick = () => {
    ovl.classList.remove("on"); flip.classList.remove("on");
    updateSlotNow();
    if (last) setTimeout(render, 150);
  };
}
document.getElementById("reshuffle").onclick = startDraw;

/* Step 4 */
function buildEcho(el, sp, aspect, question) {
  el.innerHTML = "<b>牌陣：</b>" + sp.name + "　<b>面向：</b>" + ASPECTS[aspect] +
    "<br><b>提問：</b>" + esc(question);
}
function buildBoard(board, sp, picks) {
  board.style.aspectRatio = sp.aspect;
  board.style.maxWidth = (sp.aspect > 2 ? 900 : 520) + "px";
  board.innerHTML = "";
  sp.slots.forEach((sl, i) => {
    const p = picks[i];
    const div = document.createElement("div");
    div.className = "slot";
    div.style.cssText = "left:" + sl.left + "%;top:" + sl.top + "%;width:" + sp.cardW + "%;height:" + sp.cardH + "%";
    div.innerHTML = '<div class="slotcard' + (p.rev ? " rev" : "") + '"><span class="no">' + sl.n +
      '</span><span class="nm">' + p.card.zh + '</span><span class="or ' + (p.rev ? "rev" : "up") + '">' +
      (p.rev ? "逆位" : "正位") + "</span></div>";
    board.appendChild(div);
  });
}
function buildRows(el, sp, picks) {
  el.innerHTML = "";
  sp.slots.forEach((sl, i) => {
    const p = picks[i];
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML = '<span class="idx">' + sl.n + '.</span>' +
      '<span class="cd">' + p.card.zh + "<em>" + p.card.en + "</em></span>" +
      '<span class="or ' + (p.rev ? "rev" : "up") + '">' + (p.rev ? "逆位" : "正位") + "</span>";
    el.appendChild(r);
  });
}
function exportText(rec) {
  const sp = SPREADS.find((s) => s.key === rec.spreadKey);
  const lines = [
    "【塔羅抽牌結果】",
    "時間：" + rec.when,
    "牌陣：" + rec.spreadName,
    "面向：" + ASPECTS[rec.aspect],
    "提問：" + rec.question,
    "",
  ];
  sp.slots.forEach((sl, i) => {
    const p = rec.picks[i];
    lines.push(sl.n + ". " + p.zh + "　" + (p.rev ? "逆位" : "正位"));
  });
  return lines.join("\n");
}
function render() {
  const sp = state.spread;
  buildEcho(document.getElementById("qEcho"), sp, state.aspect, state.question);
  buildBoard(document.getElementById("board"), sp, state.picks);
  buildRows(document.getElementById("rows"), sp, state.picks);
  const rec = saveRecord();
  state.recId = rec.id;
  document.getElementById("exportText").value = exportText(rec);
  document.getElementById("copyOk").textContent = "";
  goto(4);
}
function doCopy(taId, okId) {
  const ta = document.getElementById(taId);
  ta.select();
  ta.setSelectionRange(0, 99999);
  let done = false;
  try { done = document.execCommand("copy"); } catch (e) {}
  if (!done && navigator.clipboard) { navigator.clipboard.writeText(ta.value); done = true; }
  document.getElementById(okId).textContent = done ? "已複製" : "請手動選取複製";
  setTimeout(() => { document.getElementById(okId).textContent = ""; }, 2500);
}
document.getElementById("copyBtn").onclick = () => doCopy("exportText", "copyOk");
document.getElementById("dCopy").onclick = () => doCopy("dExport", "dCopyOk");
document.getElementById("dlBtn").onclick = () => {
  const blob = new Blob([document.getElementById("exportText").value], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "塔羅抽牌結果.txt";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("again").onclick = () => {
  state = { spread: null, aspect: state.aspect, question: "", order: [], picks: [], recId: null };
  document.getElementById("qtext").value = "";
  goto(1);
};

/* 紀錄 */
const HKEY = "tarot.share.v1";
function loadHistory() { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } }
function writeHistory(l) { try { localStorage.setItem(HKEY, JSON.stringify(l.slice(0, 300))); } catch (e) {} }
function stamp(d) {
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate()) +
    "（" + "日一二三四五六"[d.getDay()] + "）" + p(d.getHours()) + ":" + p(d.getMinutes());
}
function saveRecord() {
  const now = new Date();
  const rec = {
    id: String(now.getTime()) + "-" + Math.random().toString(36).slice(2, 7),
    iso: now.toISOString(), when: stamp(now),
    spreadKey: state.spread.key, spreadName: state.spread.name,
    aspect: state.aspect, question: state.question,
    picks: state.picks.map((p) => ({ zh: p.card.zh, en: p.card.en, rev: p.rev })),
  };
  const l = loadHistory(); l.unshift(rec); writeHistory(l);
  return rec;
}
function findCard(zh) { return DECK.find((c) => c.zh === zh); }
function showHistory() {
  document.getElementById("hisDetail").classList.remove("on");
  document.getElementById("hisList").style.display = "flex";
  document.getElementById("hisTitle").textContent = "抽牌紀錄";
  const box = document.getElementById("hisList");
  const l = loadHistory();
  box.innerHTML = "";
  if (!l.length) {
    box.innerHTML = '<div class="empty">還沒有任何紀錄。完成一次抽牌後就會自動存在這裡。</div>';
    goto(5); return;
  }
  l.forEach((r) => {
    const row = document.createElement("div");
    row.className = "hisrow";
    const cards = r.picks.map((p) => p.zh + (p.rev ? "逆" : "正")).join("、");
    row.innerHTML = '<div class="info"><div class="when">' + esc(r.when) + "</div>" +
      '<div class="qq">' + esc(r.question) + "</div>" +
      '<div class="meta"><em>' + esc(r.spreadName) + "</em>　" + esc(ASPECTS[r.aspect]) +
      "　" + esc(cards) + "</div></div><button class=\"del\">刪除</button>";
    row.querySelector(".info").onclick = () => showDetail(r.id);
    row.querySelector(".del").onclick = (e) => {
      e.stopPropagation();
      if (!confirm("確定要刪除這筆紀錄嗎？")) return;
      writeHistory(loadHistory().filter((x) => x.id !== r.id));
      showHistory();
    };
    box.appendChild(row);
  });
  goto(5);
}
function showDetail(id) {
  const r = loadHistory().find((x) => x.id === id);
  if (!r) return;
  const sp = SPREADS.find((s) => s.key === r.spreadKey);
  const picks = r.picks.map((p) => ({ card: findCard(p.zh) || { zh: p.zh, en: p.en || "", group: "" }, rev: p.rev }));
  if (!sp) return;
  document.getElementById("hisTitle").textContent = "紀錄 · " + r.when;
  document.getElementById("hisList").style.display = "none";
  document.getElementById("hisDetail").classList.add("on");
  buildEcho(document.getElementById("dEcho"), sp, r.aspect, r.question);
  buildBoard(document.getElementById("dBoard"), sp, picks);
  buildRows(document.getElementById("dRows"), sp, picks);
  document.getElementById("dExport").value = exportText(r);
  document.getElementById("dCopyOk").textContent = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.getElementById("hisBtn").onclick = showHistory;
document.getElementById("toHis").onclick = showHistory;
document.getElementById("detBack").onclick = showHistory;
document.getElementById("hisBack").onclick = () => goto(state.picks.length ? 4 : 1);
document.getElementById("hisClear").onclick = () => {
  if (!loadHistory().length) return;
  if (!confirm("確定要清空所有抽牌紀錄嗎？此動作無法復原。")) return;
  writeHistory([]); showHistory();
};
