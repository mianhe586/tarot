lor:#8b8075}details.backup{margin-top:16px;border-top:1px solid #ece5da;padding-top:12px}details.backup summary{font-size:13px;color:#8b8075;cursor:pointer}details.backup p{margin:12px 0 10px}.copybox textarea{min-height:150px;font-size:13px;line-height:1.6;background:#faf8f4}.cpbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}.ok{font-size:13px;color:#4a6b47}.foot{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}.hislist{display:flex;flex-direction:column;gap:10px}.hisrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid #ddd3c4;border-radius:10px;padding:14px 16px}.hisrow .info{flex:1;min-width:0;cursor:pointer}.hisrow .when{font-size:12px;color:#a1937f;letter-spacing:.03em}.hisrow .qq{font-size:15px;margin:3px 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hisrow .meta{font-size:12px;color:#8b8075}.hisrow .meta em{font-style:normal;color:#2e3f5c}.hisrow .del{border:none;background:none;color:#b9a894;font:inherit;font-size:13px;cursor:pointer;padding:6px 8px;border-radius:6px;flex:none}.hisrow .del:hover{background:#f6ece9;color:#9a5449}.empty{color:#8b8075;font-size:14px;padding:30px 0;text-align:center}.readbox{background:#fff;border:1px solid #ddd3c4;border-radius:12px;padding:18px 22px;margin:22px 0}.readhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.readhead h3{margin:0;font-size:16px;color:#2e3f5c}.readbody p{margin:0 0 12px;font-size:14.5px;text-align:justify}.readbody.busy{color:#8b8075;font-size:14px}.readbody.err{color:#9a5449;font-size:14px}.readat{font-size:12px;color:#a1937f;margin-bottom:10px}.detail{display:none}.detail.on{display:block}</style>

<body>
<div class="wrap">
<div class="topbar">
<div>
<h1>塔羅抽牌</h1>
<div class="sub">這個工具只負責洗牌、抽牌與保存結果，不提供牌義解讀。</div>
</div>
<button class="ghost" id="hisBtn">抽牌紀錄</button>
</div>
<div class="stepbar" id="stepbar">
<span id="b1">1 選牌陣</span><span id="b2">2 提問</span><span id="b3">3 抽牌</span><span id="b4">4 結果</span>
</div>
<div class="step on" id="s1">
<h2>選擇一個牌陣</h2>
<div class="cards3" id="spreadList"></div>
</div>
<div class="step" id="s2">
<h2>你想問什麼？</h2>
<textarea id="qtext" placeholder="例如：我和現在這位對象有沒有長期發展的可能？&#10;例如：該不該接下這個新的工作機會？"></textarea>
<div style="font-size:13px;color:#8b8075;margin-top:10px">這個提問偏向哪個面向？</div>
<div class="chips" id="aspects"></div>
<button class="go" id="toDraw">開始抽牌</button>
<button class="ghost" onclick="goto(1)">上一步</button>
</div>
<div class="step" id="s3">
<h2>洗牌與抽牌</h2>
<div class="shufrow">
<button class="shuf" id="shufBtn">按住洗牌</button>
<span class="shufhint" id="shufHint">按住不放，牌會一直洗；放開就停下來。心裡想著你的提問。</span>
</div>
<div class="prog">已抽 <b id="cnt">0</b> / <span id="need">0</span> 張</div>
<div class="slotnow" id="slotNow"></div>
<div class="taken" id="taken"></div>
<div class="deck" id="deck"></div>
<div class="foot">
<button class="ghost" id="backQ">上一步</button>
<button class="ghost" id="backSpread">回到牌陣</button>
</div>
</div>
<div class="step" id="s4">
<div class="q" id="qEcho"></div>
<div class="board" id="board"></div>
<div class="rows" id="rows"></div>
<div class="copybox">
<div id="sendBox">
<p>抽牌完成，把結果送出就可以了。</p>
<div class="sendrow">
<input id="who" type="text" placeholder="你的暱稱（讓對方知道是誰抽的）" maxlength="20">
<button class="go" id="sendBtn">傳送結果</button>
</div>
<div class="sendstate" id="sendState"></div>
</div>
<div class="diag" id="diagBox" style="display:none">
<div class="dghead">
<b>連線診斷</b>
<button id="diagRun">重新檢查</button>
</div>
<pre id="diagOut">按「重新檢查」開始</pre>
<button class="dgcopy" id="diagCopy">複製診斷結果</button>
</div>
<details class="backup" id="backupBox">
<summary>傳送不成功？改用複製</summary>
<p>把下面這段文字傳給幫你解牌的人。</p>
<textarea id="exportText" readonly></textarea>
<div class="cpbtns">
<button class="go" id="copyBtn">複製結果</button>
<button class="ghost" id="dlBtn">下載成文字檔</button>
<span class="ok" id="copyOk"></span>
</div>
</details>
</div>
<div class="foot">
<button class="go" id="again">再抽一次</button>
<button class="ghost" id="toHis">看抽牌紀錄</button>
</div>
</div>
<div class="step" id="s5">
<div class="topbar" style="margin-bottom:16px">
<h2 style="margin:0" id="hisTitle">抽牌紀錄</h2>
<div style="display:flex;gap:8px">
<button class="ghost" id="hisBack">回到抽牌</button>
<button class="ghost" id="hisClear">清空全部</button>
</div>
</div>
<div id="hisList" class="hislist"></div>
<div id="hisDetail" class="detail">
<button class="ghost" id="detBack" style="margin-bottom:16px">← 回到列表</button>
<div class="q" id="dEcho"></div>
<div class="board" id="dBoard"></div>
<div class="rows" id="dRows"></div>
<div class="readbox" id="readBox">
<div class="readhead">
<h3>你的解讀</h3>
<button class="ghost" id="readBtn">重新整理</button>
</div>
<div class="readbody" id="readBody"></div>
</div>
<div class="copybox">
<p>這一次的結果：</p>
<textarea id="dExport" readonly></textarea>
<div class="cpbtns">
<button class="go" id="dCopy">複製結果</button>
<button class="ghost" id="dSend">重新傳送</button>
<span class="ok" id="dCopyOk"></span>
</div>
<div class="sendstate" id="dSendState"></div>
</div>
</div>
</div>
</div>
<div class="ovl" id="ovl">
<div class="revealbox">
<div class="rslot" id="rslot"></div>
<div class="perspec">
<div class="flip" id="flip">
<div class="fface ffront" id="ffront"></div>
<div class="fface fback"></div>
</div>
</div>
<div class="rname" id="rname"></div>
<button class="go" id="nextBtn">繼續</button>
</div>
